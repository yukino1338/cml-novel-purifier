name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_fixed_performance:
        description: Run the full relative benchmark on a cml-performance self-hosted runner
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    env:
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile compatibility surface
        run: python -m compileall -q scripts tests
      - name: Run cross-platform core workflow smoke
        run: >-
          python -m unittest
          tests.test_cross_platform_f7
          tests.test_preprocess_encoding_f4
          tests.test_export_formats_f4.ExportFormatsF4Tests.test_txt_markdown_and_epub_preserve_the_same_semantic_text
          tests.test_end_to_end_f7.FullPipelineF7Tests.test_real_subprocess_cli_happy_path
          tests.test_end_to_end_f7.FullPipelineF7Tests.test_two_fresh_single_book_runs_are_exact_and_semantically_identical
          tests.test_path_guards_f1
          tests.test_execution_transactions_f1
          tests.test_persistence_faults_f7.PersistenceFaultsF7Tests.test_real_terminated_subprocess_releases_lock_and_recovers_transaction
          tests.test_precise_rollback_f3.PreciseRollbackF3Tests.test_chapter_rollback_filters_only_the_matching_cross_chapter_anchor

  quality:
    name: Quality gates / Ubuntu / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Lint Python sources
        run: python -m ruff check scripts tests
      - name: Run full unit, EPUB, and privacy-path suite with branch coverage
        run: python -m coverage run --branch -m unittest discover -s tests -p "test*.py"
      - name: Write coverage report
        run: python -m coverage json -o coverage.json
      - name: Enforce coverage thresholds
        run: python scripts/check_coverage.py coverage.json
      - name: Run deterministic scanner semantic benchmark
        run: >-
          python scripts/benchmark_scan.py
          --profile ci
          --scope both
          --workload both
          --repeat 3
          --baseline tests/performance/scan_baseline_ci.json
      - name: Validate Skill, YAML, JSON, and CLI release contracts
        run: python scripts/check_release.py

  performance:
    name: Full scanner objectives / Ubuntu / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Enforce full boundary performance and frozen semantics
        run: >-
          python scripts/benchmark_scan.py
          --profile full
          --scope boundary
          --workload both
          --repeat 3
          --baseline tests/performance/scan_baseline_full.json

  fixed-performance:
    name: Full relative scanner regression / fixed runner
    if: github.event_name == 'workflow_dispatch' && inputs.run_fixed_performance
    runs-on: [self-hosted, cml-performance]
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.3"
      - name: Enforce the fixed-environment 15 percent regression limit
        run: >-
          python scripts/benchmark_scan.py
          --profile full
          --scope both
          --workload both
          --repeat 3
          --baseline tests/performance/scan_baseline_full.json
          --require-comparable-baseline

  browser:
    name: Browser / Ubuntu / Python 3.11 / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CML_REQUIRE_BROWSER_TESTS: "1"
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install browser test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m unittest tests.test_review_browser_f6
